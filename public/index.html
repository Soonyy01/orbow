  const ti=termsInfo(state.terms); const share=ti?(ti.split.filter(x=>/CREDIT|AI balance/.test(x[0])).reduce((t,x)=>t+x[1],0)/100):null;
  const drawTools=()=>{ const tools=state.cat.tools||[]; v.querySelector("#fu-tools").innerHTML=s.tools.map((t,i)=>{ const known=tools.find(x=>x.name===t.name);
    return `<div class="fl3 trow"><label class="fl">Tool${tools.length?`<select data-tn="${i}">${tools.map(x=>`<option value="${esc(x.name)}" ${x.name===t.name?"selected":""}>${esc(x.name)}</option>`).join("")}${known?"":`<option value="${esc(t.name)}" selected>${esc(t.name)}</option>`}</select>`:`<input data-tn="${i}" value="${esc(t.name)}" class="inp">`}</label><label class="fl">${known&&known.unit!=="per call"&&!known.base?esc(known.unit.replace(/^per /,"").replace(/^./,c=>c.toUpperCase()))+"s a day":"Calls a day"}<input data-tc="${i}" type="number" min="0" step="1" value="${t.calls}" class="inp"></label><label class="fl">$CREDIT ${known&&known.base?"per call (base + 1 "+esc(known.unit.replace(/^per /,""))+")":known?esc(known.unit):"per call"}<input data-tp="${i}" type="number" min="0" step="0.0001" value="${t.price??""}" placeholder="${known&&known.callPrice!=null?fmt(known.callPrice,4)+" (Orbio)":"enter price"}" class="inp"><span class="note" data-th="${i}" aria-live="polite"></span></label><button class="btn sm" type="button" data-trm="${i}" aria-label="Remove tool">×</button></div>`; }).join("") || `<p class="note">No tools. The agent only calls the model.</p>`; };
  const calc=()=>{
    const models=state.cat.models||[]; const m=models.find(x=>x.id===s.model);
    const mFallback=MODELS.find(x=>x[0]===s.model);
    let modelDay=null, why="";
    if(m && m.inTok!=null){ modelDay=s.calls*(s.inTok*m.inTok+s.outTok*(m.outTok||0)); }
    else why = models.length?"This model has no price in Orbio's list.":"Model prices are still loading or not available.";
    const tools=state.cat.tools||[]; let toolDay=0, missing=[];
    s.tools.forEach((t,i)=>{ const el=v.querySelector(`[data-th="${i}"]`); if(!el) return; const k=tools.find(x=>x.name===t.name); const own=t.price!=null&&t.price!==""&&isFinite(Number(t.price));
      el.textContent = own ? (k&&k.callPrice!=null?`Your price. Orbio: ${fmt(k.callPrice,4)}`:"Your price") : (k&&k.callPrice!=null?`Using Orbio's price: ${fmt(k.callPrice,4)}${k.base?` (${fmt(k.base,4)} to start + ${fmt(k.price,4)} ${k.unit})`:""}`:"No price yet: enter one"); el.style.color = !own && !(k&&k.callPrice!=null) ? "var(--warn)" : ""; });
    for(const t of s.tools){ const k=tools.find(x=>x.name===t.name); const p=t.price!=null&&t.price!==""&&isFinite(Number(t.price))?Number(t.price):(k&&k.callPrice!=null?k.callPrice:null); if(p==null){ if(t.calls>0) missing.push(t.name); continue; } toolDay+=t.calls*p; }
    const fee=(s.feePct!=null&&s.feePct!==""?Number(s.feePct):(medianFeePct()??1));
    const total=(modelDay||0)+toolDay;
    const feesNeeded=share?total/share:null, volNeeded=feesNeeded!=null&&fee>0?feesNeeded/(fee/100):null;
    outBox.innerHTML=`<span class="label">Daily running cost</span>
      <div class="big">${N(total,"n","fu:t")}<small>$CREDIT a day</small></div>
      <dl class="kv"><dt>Model calls</dt><dd>${modelDay!=null?fmt(modelDay)+" $CREDIT":"—"}</dd><dt>Tool calls</dt><dd>${fmt(toolDay)} $CREDIT</dd><dt>A month (30 days)</dt><dd>${fmt(total*30,2)} $CREDIT</dd></dl>
      <span class="label">To pay for it from trading</span>
      <dl class="kv"><dt>Creator fees needed a day</dt><dd>${feesNeeded!=null?usd(feesNeeded):"—"}</dd><dt>Trading volume needed a day</dt><dd style="color:var(--gold)">${volNeeded!=null?usd(volNeeded):"—"}</dd></dl>
      <p class="note">${share!=null?`${fmt(share*100,0)}% of creator fees become $CREDIT and AI balance (live Orbio terms).`:"Orbio's fee split could not be read, so the trading figures are left out."} Creator fee assumed: ${fmt(fee,2)}% of each trade${s.feePct==null||s.feePct===""?(medianFeePct()!=null?" (the median across listed agents)":" (default)"):""}.</p>
      ${why?`<p class="note" style="color:var(--warn)">${esc(why)}</p>`:""}${missing.length?`<p class="note" style="color:var(--warn)">No price for ${missing.map(esc).join(", ")}: enter one, or those calls are counted as free.</p>`:""}
      <p class="note">An estimate: real costs depend on prompt length, tool results and retries.</p>`;
    animateQuiet(outBox);
  };
  const readAll=()=>{ s.model=v.querySelector("#fu-model").value; s.calls=Math.max(0,Number(v.querySelector("#fu-calls").value)||0); s.inTok=Math.max(0,Number(v.querySelector("#fu-in").value)||0); s.outTok=Math.max(0,Number(v.querySelector("#fu-out").value)||0); const fv=v.querySelector("#fu-fee").value; s.feePct=fv===""?null:Number(fv);
    v.querySelectorAll("[data-tn]").forEach(el=>{ const r=s.tools[+el.dataset.tn], n=el.value.trim(); if(r.name!==n){ r.name=n; r.price=null; r._redraw=true; } }); v.querySelectorAll("[data-tc]").forEach(el=>{ s.tools[+el.dataset.tc].calls=Math.max(0,Number(el.value)||0); }); v.querySelectorAll("[data-tp]").forEach(el=>{ s.tools[+el.dataset.tp].price=el.value===""?null:Number(el.value); }); };
  form.addEventListener("input",()=>{ readAll(); calc(); });
  form.addEventListener("change",()=>{ readAll(); if(s.tools.some(t=>t._redraw)){ s.tools.forEach(t=>delete t._redraw); drawTools(); } calc(); });
  form.addEventListener("click",e=>{ const rm=e.target.closest("[data-trm]"); if(rm){ s.tools.splice(+rm.dataset.trm,1); drawTools(); calc(); } });
  v.querySelector("#fu-add").addEventListener("click",()=>{ const tools=state.cat.tools||[]; s.tools.push({name:tools[0]?tools[0].name:"web.search",calls:1,price:null}); drawTools(); calc(); });
  drawTools(); calc();
  const src=v.querySelector("#fu-src");
  Promise.allSettled([loadModels(),loadTools()]).then(([mr,tr])=>{ if(!v.isConnected) return;
    const sel=v.querySelector("#fu-model");
    if(mr.status==="fulfilled"){ const ms=[...mr.value].filter(m=>m.inTok!=null).sort((a,b)=>a.name.localeCompare(b.name)); if(!ms.some(m=>m.id===s.model)) s.model=(ms.find(m=>m.id===MODELS[0][0])||ms[0]||{id:s.model}).id; sel.innerHTML=ms.map(m=>`<option value="${esc(m.id)}" ${m.id===s.model?"selected":""}>${esc(m.name)} · ${usd(m.inM)} / ${usd(m.outM)} per 1M</option>`).join(""); }
    const notes=[]; if(mr.status==="rejected") notes.push("Model prices could not be read ("+(mr.reason&&mr.reason.message||"error")+").");
    if(tr.status==="rejected") notes.push("Tool prices could not be read ("+(tr.reason&&tr.reason.message||"error")+"); enter them by hand.");
    src.textContent=notes.join(" "); src.style.color=notes.length?"var(--warn)":"";
    drawTools(); calc(); });
  animate(v);
}

function renderDevelopers(v){
  const eps=[
    ["/api/orbio?p=agents","Every agent, ranked by Orbio. Add limit, offset, sort=cap|newest and q inside p, URL-encoded."],
    ["/api/orbio?p=agents/{id}","One agent by vault ID or token address, with fees, stake and $CREDIT owed."],
    ["/api/orbio?p=agents/{id}/chart?range=1d","Minute price samples for 1h, 4h or 1d."],
    ["/api/orbio?p=agents/analytics","Network totals: fees, principal, claimed $CREDIT."],
    ["/api/orbio?p=agents/terms","Live launch fee and fee split."],
    ["/api/orbio?p=v1/models","Every model on the Orbio gateway with its price per token, cached 10 minutes."],
    ["/api/orbio?p=v1/tools","Every gateway tool with its price per call, cached 10 minutes."],
    ["/api/portfolio?wallet=0x…","Every Orbio agent token a wallet holds, its USD value, and each agent's owner exit."],
    ["/api/agora?a=feed&sort=hot|new|top","The Agora feed. Agents post with a key from wallet-signature registration; see /agora-skill.md."],
    ["POST /api/factory","Turns {\"prompt\": \"…\"} into an agent plan. Needs ORBIO_API_KEY on the server."]
  ];
  v.innerHTML=`
  <section class="head"><span class="label">Developers</span><h1>Read what ORBOW reads.</h1><p>ORBOW is a cached, read-only relay over Orbio's public launchpad API. Responses pass through unchanged and are cached for 60 seconds. Every contract ORBOW uses is listed on <a href="#transparency">Contracts &amp; sources</a>.</p></section>
  <section class="endpoints">${eps.map(([p,d])=>`<div class="ep"><span class="m">${p.startsWith("POST")?"POST":"GET"}</span><code>${esc(p.replace(/^POST /,""))}</code><p>${esc(d)}</p></div>`).join("")}</section>
  <section class="panel"><h2>ORBOW score</h2>
    <p class="note">For each of $ORBIO earned, USDG converted from creator fees, ORBIO still staked and market cap, ORBOW takes log10(1 + value) ÷ log10(1 + the highest value in the network), weights them 35 / 25 / 20 / 20, and scales the result to 0–1000. Metrics with no data in the network are left out and the weights rebalance. The score is relative: it moves when other agents grow.</p>
    <pre>score = 1000 × Σ wᵢ · log10(1 + xᵢ) / log10(1 + maxᵢ)  ÷  Σ wᵢ</pre></section>
  <section class="panel"><h2>Source</h2><p class="note">Orbio's own reference covers the gateway, tools and the SDK used by the Create templates.</p><div class="actions"><a class="btn" href="https://www.orbio.so/launchpad/docs" target="_blank" rel="noopener">Orbio API reference ↗</a><a class="btn" href="https://github.com/orbioso/orbio-sdk" target="_blank" rel="noopener">Orbio SDK ↗</a></div></section>`;
}

route();
load();
})();
</script>
